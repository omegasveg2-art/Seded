      - name: get Il2CppDumper
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*\.zip"' \
            | grep -iE 'net(6|7|8)' | head -1 | sed -E 's/.*"(https:[^"]+)"/\1/')
          [ -n "$URL" ] || URL=$(curl -fsSL https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*\.zip"' | head -1 | sed -E 's/.*"(https:[^"]+)"/\1/')
          echo "downloading: $URL"
          curl -fsSL -o il2cppdumper.zip "$URL"
          unzip -q il2cppdumper.zip -d il2cppdumper
